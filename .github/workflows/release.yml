name: Release check

# The release zip is built on a developer machine, not here: the assembly compiles against
# VNyan's own Unity and VNyanInterface assemblies, which exist only in a VNyan install and
# are not ours to commit, and the shader bundle is built by the Unity editor. See "Releasing"
# in the README.
#
# What this workflow does is check the zip attached to a release against the plugin zip
# contract MikanLauncher installs from: plugin.json at the root beside the files it names,
# a version that matches the tag and the zip's name. It runs when a release is published,
# and by hand against a draft before publishing it:
#   gh workflow run release.yml -f tag=v0.2.0
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to check, for example v0.2.0. Drafts are found too.
        required: true

# Reading a draft release and its assets needs write access to contents. Nothing here
# writes to the repository or the release.
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Exactly one asset may match: zero means the zip was never attached, and two means
      # MikanLauncher's MikanXR_VNyan_*.zip pattern would be ambiguous.
      - name: Download the release zip
        run: |
          mkdir release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'MikanXR_VNyan_*.zip' --dir release
          ls -l release
          count=$(ls release | wc -l)
          if [ "$count" != "1" ]; then
            echo "Release $TAG has $count assets matching MikanXR_VNyan_*.zip, expected 1"
            exit 1
          fi

      # The script comes from the checkout, never from the downloaded zip, and -I keeps
      # Python from loading anything out of the working directory.
      - name: Check the zip against the contract
        run: python3 -I tools/package.py --verify release/MikanXR_VNyan_*.zip --tag "$TAG"
